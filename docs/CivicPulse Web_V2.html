<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CivicPulse — Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Caprasimo&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* CivicPulse — Web (desktop) — same warm system, wider canvas */
  :root {
    --bg:        #F6F1E7;
    --bg-2:      #FBF7EE;
    --paper:     #FFFFFF;
    --ink:       #1A1F2E;
    --ink-2:     #4F5A70;
    --ink-3:     #8B95A8;
    --line:      #E8DFCD;
    --line-2:    #D9CFB8;
    --primary:   oklch(0.48 0.09 220);
    --primary-2: oklch(0.42 0.10 220);
    --primary-soft: oklch(0.48 0.09 220 / 0.10);
    --accent:    oklch(0.82 0.14 75);
    --accent-2:  oklch(0.74 0.16 60);
    --success:   oklch(0.68 0.13 155);
    --warn:      oklch(0.74 0.15 55);
    --alert:     oklch(0.64 0.19 25);
    --display:   "Caprasimo", Georgia, serif;
    --sans:      "Plus Jakarta Sans", -apple-system, system-ui, sans-serif;
    --mono:      "DM Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(ellipse at 0% 0%, oklch(0.82 0.14 75 / 0.25) 0%, transparent 50%),
      radial-gradient(ellipse at 100% 100%, oklch(0.48 0.09 220 / 0.12) 0%, transparent 50%),
      linear-gradient(180deg, #F2EAD7 0%, #EFE6CF 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--accent); color: var(--ink); }
  h1,h2,h3,h4 { margin: 0; font-weight: 700; letter-spacing: -0.015em; }
  .display { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: var(--mono); }
  .num { font-variant-numeric: tabular-nums; }

  /* Cards */
  .card {
    background: var(--paper);
    border-radius: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.8) inset,
      0 1px 3px rgba(26,31,46,0.04),
      0 8px 24px rgba(26,31,46,0.06);
  }
  /* Buttons */
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border:none; cursor:pointer; font-family:var(--sans); font-weight:600;
    border-radius:999px; transition: all 0.18s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--ink); color:#fff; padding: 14px 22px; font-size: 15px; box-shadow: 0 6px 18px rgba(26,31,46,0.22); }
  .btn-primary:hover { background: var(--primary-2); }
  .btn-sunny { background: var(--accent); color: var(--ink); padding: 14px 22px; font-size: 15px; box-shadow: 0 6px 18px oklch(0.82 0.14 75 / 0.45); }
  .btn-ghost { background:transparent; border:1.5px solid var(--line-2); color:var(--ink); padding: 12px 18px; font-size: 14px; }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-block { width:100%; }
  .btn-jumbo { padding: 18px 26px; font-size: 16px; font-weight: 700; }

  /* Animations */
  @keyframes ring {
    0%   { transform: scale(0.5); opacity: 0.7; }
    100% { transform: scale(2.5); opacity: 0; }
  }
  .ring { position:absolute; inset:0; border-radius:50%; border:2px solid currentColor; pointer-events:none; animation: ring 2.4s ease-out infinite; }
  .ring.r2 { animation-delay: 0.8s; }
  .ring.r3 { animation-delay: 1.6s; }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.6; transform: scale(1.15); }
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: blink 1.6s ease-in-out infinite; }
  @keyframes fade-up { from { transform: translateY(14px); } to { transform: translateY(0); } }
  .fade-up { animation: fade-up 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .float { animation: float 4s ease-in-out infinite; }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .grow { transform-origin: bottom; animation: grow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  /* Chips */
  .chip {
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:999px;
    background: var(--bg); font-size: 12px; font-weight: 600; color: var(--ink-2);
  }
  .chip.dark { background: var(--ink); color: var(--bg); }

  /* Category swatches */
  .cat-pothole     { --c-bg: oklch(0.92 0.05 60); --c-fg: oklch(0.40 0.12 50); }
  .cat-streetlight { --c-bg: oklch(0.92 0.07 90); --c-fg: oklch(0.45 0.14 75); }
  .cat-garbage     { --c-bg: oklch(0.92 0.05 145); --c-fg: oklch(0.42 0.12 150); }
  .cat-water       { --c-bg: oklch(0.92 0.05 220); --c-fg: oklch(0.42 0.12 220); }
  .cat-drainage    { --c-bg: oklch(0.92 0.05 250); --c-fg: oklch(0.42 0.12 250); }
  .cat-power       { --c-bg: oklch(0.92 0.06 30); --c-fg: oklch(0.50 0.18 28); }
  .cat-other       { --c-bg: oklch(0.92 0.04 300); --c-fg: oklch(0.45 0.12 300); }

  /* Status colors used by StatusStepper */
  .st-submitted    { --st: var(--ink-3); }
  .st-acknowledged { --st: var(--accent-2); }
  .st-in_progress  { --st: var(--primary); }
  .st-resolved     { --st: var(--success); }
  .st-rejected     { --st: var(--alert); }
  .step-line { background: var(--line); height:3px; border-radius:2px; }
  .step-fill { background: var(--st, var(--primary)); height:3px; border-radius:2px; }
  .step-dot { width:14px; height:14px; border-radius:50%; background: var(--paper); border:2.5px solid var(--line); flex-shrink:0; }
  .step-dot.done { border-color: var(--st, var(--primary)); background: var(--st, var(--primary)); }
  .step-dot.current { border-color: var(--st, var(--primary)); background: var(--paper); position:relative; }
  .step-dot.current::before { content:""; position:absolute; inset:-2px; border-radius:50%; border:2px solid var(--st, var(--primary)); animation: ring 1.8s ease-out infinite; opacity: 0.5; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  /* App shell (web) */
  .web-shell {
    display: flex;
    min-height: 100vh;
  }
  .web-sidebar {
    flex: 0 0 264px;
    width: 264px;
    position: sticky; top: 0;
    align-self: flex-start;
    height: 100vh;
    padding: 24px 18px;
    display: flex; flex-direction: column;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-right: 1px solid var(--line);
  }
  .web-main { flex: 1; min-width: 0; }
  .web-topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px;
    padding: 22px 36px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .web-content { padding: 32px 36px 80px; max-width: 1280px; }

  /* Brand */
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 6px 8px 24px;
  }
  .brand-mark {
    width: 36px; height: 36px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 16px oklch(0.82 0.14 75 / 0.45);
    position: relative;
    overflow: hidden;
  }
  .brand-mark .dot { width: 10px; height: 10px; border-radius: 50%; background: white; box-shadow: 0 0 0 0 white; animation: blink 1.6s ease-in-out infinite; }
  .brand-name { font-family: var(--display); font-size: 24px; letter-spacing: -0.015em; }
  .brand-name em { color: var(--primary); font-style: italic; }

  /* Sidebar nav */
  .nav { list-style:none; padding:0; margin:0; display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: transparent;
    border: none;
    color: var(--ink-2);
    font-family: var(--sans); font-weight: 600; font-size: 14px;
    cursor: pointer; text-align: left;
    transition: all 0.18s ease;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,0.5); color: var(--ink); }
  .nav-item.active { background: var(--ink); color: white; box-shadow: 0 6px 18px rgba(26,31,46,0.18); }
  .nav-item .ic { display:flex; flex-shrink: 0; }
  .nav-item .badge {
    margin-left: auto; font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    background: var(--accent); color: var(--ink);
  }
  .nav-item.active .badge { background: var(--accent); color: var(--ink); }

  /* Search */
  .search {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 18px;
    width: 360px; max-width: 100%;
  }
  .search input {
    flex: 1; background: transparent; border:none; outline: none;
    font-family: var(--sans); font-size: 14px; color: var(--ink);
  }
  .search input::placeholder { color: var(--ink-3); }
  .kbd {
    font-family: var(--mono); font-size: 11px;
    color: var(--ink-3);
    padding: 2px 6px;
    border: 1px solid var(--line-2);
    border-radius: 6px;
    background: white;
  }

  /* Map */
  .map-bg {
    background:
      radial-gradient(circle at 30% 40%, oklch(0.92 0.05 145 / 0.7), transparent 35%),
      radial-gradient(circle at 70% 60%, oklch(0.90 0.06 220 / 0.4), transparent 40%),
      repeating-linear-gradient(45deg, transparent 0 18px, rgba(0,0,0,0.025) 18px 19px),
      repeating-linear-gradient(-45deg, transparent 0 18px, rgba(0,0,0,0.025) 18px 19px),
      linear-gradient(180deg, #EFE8D7, #E5DCC4);
  }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="friendly-icons.jsx"></script>
  <script type="text/babel" src="friendly-screens.jsx"></script>
  <script type="text/babel" src="web-screens.jsx"></script>
  <script type="text/babel" src="web-app.jsx"></script>
</body>
</html>
